<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c34"><title>Qur'an Companion</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18352f;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}header{background:#123c34;color:white;padding:24px 18px;text-align:center}header h1{margin:0;font-size:1.8rem}header p{margin:8px 0 0;color:#d9e8df}.wrap{max-width:940px;margin:24px auto;padding:0 16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:white;padding:18px;border-radius:16px;box-shadow:0 2px 15px #123c3412}label{display:block;font-size:.82rem;font-weight:700;margin-bottom:6px}select,input,button{width:100%;font:inherit;padding:12px;border:1px solid #b9cfc5;border-radius:10px;background:white;color:#18352f}button{cursor:pointer;background:#123c34;color:#fff;border:0}button:hover{background:#20594c}.title{text-align:center;margin:24px auto 12px}.title h2{margin:0 0 8px}.sub{color:#60736a;font-size:.91rem}.verse{padding:22px;background:white;margin:12px 0;border-radius:14px;border:1px solid #e2ece5;scroll-margin-top:20px}.verse:target,.verse.selected{border-color:#b18d47;background:#fffaf0}.arabic{direction:rtl;text-align:right;line-height:2.3;font-family:'Noto Naskh Arabic','Traditional Arabic',serif;font-size:2rem;white-space:pre-wrap}.versefoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;color:#60736a;font-size:.9rem}.versefoot button{width:auto;padding:8px 13px;font-size:.85rem}.note{margin:18px 0;line-height:1.55;color:#566a60;font-size:.9rem}.msg{background:#fff7e5;padding:18px;border-radius:12px;color:#6f4a15}.hide{display:none}footer{text-align:center;padding:30px 10px;color:#60736a;font-size:.8rem}@media(max-width:580px){.controls{grid-template-columns:1fr}.arabic{font-size:1.7rem}}
</style>
</head>
<body>
<header><h1>Qur'an Companion</h1><p>Read the Holy Qur'an • Share a verse • QR-friendly links</p></header>
<main class="wrap">
<div class="controls"><div><label for="chapter">Surah</label><select id="chapter"><option>Loading Surahs…</option></select></div><div><label for="ayah">Go to verse (Al Islam numbering)</label><input id="ayah" type="number" min="1" value="1"></div><div><button id="go">Go to verse</button></div><div><button id="share">Copy verse link</button></div></div>
<div class="title"><h2 id="surahTitle">Loading…</h2><div class="sub" id="subtitle"></div></div>
<div class="note" id="sourceNote">Checking for local Al Islam Arabic data…</div>
<div id="verses" aria-live="polite"></div>
</main><footer>Qur'an Companion · Please verify any imported Arabic dataset against Al Islam before publishing as an exact transcription.</footer>
<script>
'use strict';
const API='https://api.alquran.cloud/v1';
const BASMALA='بِسْمِ اللّٰهِ الرَّحْمَٰنِ الرَّحِيْمِ';
const chapter=document.getElementById('chapter'),ayah=document.getElementById('ayah');
const verses=document.getElementById('verses'),surahTitle=document.getElementById('surahTitle'),subtitle=document.getElementById('subtitle'),sourceNote=document.getElementById('sourceNote');
let local=null,verified={},metadata=[],current=[],source='',requestId=0;
const englishNames=['Al-Fatihah','Al-Baqarah','Aal-e-Imran','An-Nisa','Al-Maidah','Al-Anam','Al-Araf','Al-Anfal','At-Taubah','Yunus','Hud','Yusuf','Ar-Rad','Ibrahim','Al-Hijr','An-Nahl','Bani Israil','Al-Kahf','Maryam','TaHa','Al-Anbiya','Al-Hajj','Al-Muminun','An-Nur','Al-Furqan','Ash-Shuara','An-Naml','Al-Qasas','Al-Ankabut','Ar-Rum','Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir','Ya Sin','As-Saffat','Sad','Az-Zumar','Al-Mumin','Ha Mim As-Sajdah','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah','Al-Ahqaf','Muhammad','Al-Fath','Al-Hujurat','Qaf','Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman','Al-Waqiah','Al-Hadid','Al-Mujadalah','Al-Hashr','Al-Mumtahinah','As-Saff','Al-Jumuah','Al-Munafiqun','At-Taghabun','At-Talaq','At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Maarij','Nuh','Al-Jinn','Al-Muzzammil','Al-Muddaththir','Al-Qiyamah','Ad-Dahr','Al-Mursalat','An-Naba','An-Naziat','Abasa','At-Takwir','Al-Infitar','At-Tatfif','Al-Inshiqaq','Al-Buruj','At-Tariq','Al-Ala','Al-Ghashiyah','Al-Fajr','Al-Balad','Ash-Shams','Al-Lail','Ad-Duha','Al-Inshirah','At-Tin','Al-Alaq','Al-Qadr','Al-Bayyinah','Az-Zilzal','Al-Adiyat','Al-Qariah','At-Takathur','Al-Asr','Al-Humazah','Al-Fil','Quraish','Al-Maun','Al-Kauthar','Al-Kafirun','An-Nasr','Al-Lahab','Al-Ikhlas','Al-Falaq','An-Nas'];
function parseLocation(){let m=location.hash.match(/^#(?:surah-)?(\d+)(?::|\/)(\d+)$/);if(m)return [+m[1],+m[2]];m=location.hash.match(/^#(?:surah-)?(\d+)$/);if(m)return [+m[1],1];let p=new URLSearchParams(location.search);return [Number(p.get('surah'))||1,Number(p.get('ayah'))||1]}
function validData(x){return x && Array.isArray(x.surahs) && x.surahs.length===114 && x.surahs.every((s,i)=>Number(s.number)===i+1 && Array.isArray(s.ayahs) && s.ayahs.length>0 && s.ayahs.every((v,j)=>Number(v.number)===j+1 && typeof v.text==='string' && v.text.trim()))}
async function getJson(url){let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function cleanBasmala(s){return s.normalize('NFD').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[\u0671\u0622\u0623\u0625]/g,'ا').replace(/\s/g,'')}
function looksLikeBasmala(s){return cleanBasmala(s).startsWith('بسماللهالرحمنالرحيم')}
async function loadSurah(n){let id=++requestId;verses.innerHTML='<div class="msg">Loading Arabic verses…</div>';let s;
try{
 if(local){s=local.surahs[n-1];current=s.ayahs.map(v=>({number:Number(v.number),text:v.text}));source='Al Islam local JSON (user supplied)';}
 else{let json=await getJson(`${API}/surah/${n}/quran-uthmani`);if(json.code!==200||!json.data?.ayahs)throw Error('Unexpected API response');s=json.data;let data=s.ayahs.map(v=>({number:v.numberInSurah,text:v.text}));
 // Al Islam counts the introductory Bismillah as verse 1 in every surah except At-Taubah.
 // The source API does not. For Al-Fatihah it already has the Bismillah as verse 1.
 if(n!==1&&n!==9){if(looksLikeBasmala(data[0]?.text||'')){current=data;}else current=[{number:1,text:BASMALA},...data.map(v=>({number:v.number+1,text:v.text}))];}
 else current=data;source='AlQuran Cloud (temporary fallback; NOT Al Islam transcription)';}
 if(!local){current=current.map(v=>{const verifiedText=verified[`${n}:${v.number}`];return verifiedText?{...v,text:verifiedText,verified:true}:v;});}
 if(id!==requestId)return;
 let name=local?s.name||englishNames[n-1]:englishNames[n-1];surahTitle.textContent=`${n}. ${name}`;
 subtitle.textContent=`${current.length} verses · Al Islam-style numbering`;
 sourceNote.textContent=local?'Arabic text supplied through alislam-quran.json; verify its provenance.':`Verified Al Islam verses in this Surah: ${current.filter(v=>v.verified).length}/${current.length}. Remaining verses use a DIFFERENT Arabic edition until the official dataset is supplied. Al Islam-style numbering is applied.`;
 verses.replaceChildren(...current.map(v=>{
  const outer=document.createElement('article');outer.className='verse';outer.id=`v-${v.number}`;
  const a=document.createElement('div');a.className='arabic';a.lang='ar';a.dir='rtl';a.textContent=v.text;
  const foot=document.createElement('div');foot.className='versefoot';
  const num=document.createElement('span');num.textContent=`${n}:${v.number}${v.verified?' · Al Islam verified':''}`;
  const b=document.createElement('button');b.textContent='Copy link';b.addEventListener('click',()=>copyLink(n,v.number));foot.append(num,b);outer.append(a,foot);return outer;
 }));
 let target=parseLocation()[1];if(+chapter.value===n)jump(target,false);
}catch(e){if(id===requestId){verses.innerHTML='';let d=document.createElement('div');d.className='msg';d.textContent='Could not load Arabic verses: '+e.message+'. Please check your connection or add alislam-quran.json.';verses.append(d)}}}
function jump(v,update=true){v=Math.max(1,Math.min(current.length,Number(v)||1));ayah.value=v;if(update)history.replaceState(null,'',`#${chapter.value}:${v}`);document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));let el=document.getElementById(`v-${v}`);if(el){el.classList.add('selected');el.scrollIntoView({behavior:'smooth',block:'start'})}}
async function copyLink(n,v){const u=new URL(location.href);u.search='';u.hash=`${n}:${v}`;try{await navigator.clipboard.writeText(u.href);alert('Verse link copied')}catch{prompt('Copy this verse link:',u.href)}}
async function init(){try{verified=await getJson('./alislam-verified-verses.json')}catch{};try{let candidate=await getJson('./alislam-quran.json');if(validData(candidate))local=candidate;else console.warn('Local Al Islam file format invalid; using fallback.')}catch{}
 chapter.replaceChildren(...englishNames.map((name,i)=>{let opt=document.createElement('option');opt.value=i+1;opt.textContent=`${i+1}. ${local?.surahs?.[i]?.name||name}`;return opt}));
 let [n,v]=parseLocation();n=n>=1&&n<=114?n:1;chapter.value=n;ayah.value=v;
 chapter.addEventListener('change',()=>{history.replaceState(null,'',`#${chapter.value}:1`);ayah.value=1;loadSurah(+chapter.value)});
 document.getElementById('go').addEventListener('click',()=>jump(ayah.value));
 document.getElementById('share').addEventListener('click',()=>copyLink(+chapter.value,+ayah.value));
 window.addEventListener('hashchange',()=>{let [nn,vv]=parseLocation();if(nn>=1&&nn<=114&&nn!==+chapter.value){chapter.value=nn;ayah.value=vv;loadSurah(nn)}else jump(vv,false)});
 loadSurah(n);
}
init();
</script></body></html>
